name: Unit Tests

on:
  pull_request:
    types: [ opened, synchronize ]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "scripts/*.sh"
      - "scripts/*.ps1"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  run_tests:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - job_name: Check Go bridge
            runner: macos-26
            suite: go
            timeout_minutes: 10
          - job_name: Run Zig tests
            runner: macos-26
            suite: zig
            timeout_minutes: 10
          - job_name: Run Apple tests
            runner: macos-26
            suite: apple
            timeout_minutes: 10
          - job_name: Run Android tests
            runner: ubuntu-latest
            suite: android
            timeout_minutes: 5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@v6
      - uses: partout-io/action-prepare-xcode-build@master
        if: matrix.suite == 'apple'
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        if: matrix.suite == 'go'
        with:
          go-version-file: src/wireguard/go/go.mod
          cache-dependency-path: src/wireguard/go/go.sum
      - name: Check Go bridge
        if: matrix.suite == 'go'
        run: go -C src/wireguard/go test ./src/...
      - name: Set up Zig
        uses: partout-io/setup-zig@v3
        if: matrix.suite == 'zig'
      - name: Run Zig tests
        if: matrix.suite == 'zig'
        run: ci/run-tests.sh
      - name: Run Apple tests
        if: matrix.suite == 'apple'
        run: ci/run-apple-tests.sh
      - uses: actions/setup-java@v5
        if: matrix.suite == 'android'
        with:
          distribution: temurin
          java-version: 21
      - name: Run Android tests
        if: matrix.suite == 'android'
        run: ci/run-android-tests.sh
