name: Unit Tests

on:
  pull_request:
    types: [ opened, synchronize ]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "scripts/*.sh"
      - "scripts/*.ps1"
      - "**/*.kt" # For now

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  run_tests:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - job_name: Run Swift tests
            runner: macos-26
            suite: swift
          - job_name: Run Zig tests
            runner: ubuntu-latest
            suite: zig
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: partout-io/action-prepare-xcode-build@master
        if: matrix.suite == 'swift'
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Swift tests
        if: matrix.suite == 'swift'
        run: |
          swift test
          cd cross/apple-legacy && swift test
      - uses: mlugg/setup-zig@v2
        if: matrix.suite == 'zig'
      - name: Run Zig tests
        if: matrix.suite == 'zig'
        run: |
          zig build test -Dopenvpn=true -Dwireguard=true
