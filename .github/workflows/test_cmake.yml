name: Test CMake Build

on:
  workflow_dispatch:

env:
  INSTALL_DIR: dist

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            runs_on: windows-latest
            arch: x64
          - name: Linux x64
            runs_on: ubuntu-latest
            arch: x64
          - name: macOS ARM64
            runs_on: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up Visual Studio
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: ${{ matrix.arch }}
      - name: Set up Zig
        uses: partout-io/setup-zig@main
      - name: Build with CMake (no vendors)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -G "Ninja Multi-Config" -S . -B .cmake `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
            -DPP_BUILD_WINRT=ON -DPP_TEST_WINRT_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .cmake --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .cmake --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full WinRT test suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir .cmake -C Release --output-on-failure --no-tests=error
      - name: Build with CMake (no vendors)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -G Ninja -S . -B .cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DPP_BUILD_CPP=ON
          cmake --build .cmake --parallel 2
          cmake --install .cmake
      - name: Configure C++ runtime tests
        shell: bash
        run: >-
          cmake -S runtimes/tests/cpp -B .cmake-cpp-tests
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/$INSTALL_DIR"
      - name: Build C++ runtime tests
        run: cmake --build .cmake-cpp-tests --config Release --parallel 2
      - name: Run C++ runtime tests
        run: ctest --test-dir .cmake-cpp-tests -C Release --output-on-failure --no-tests=error
      - name: Verify output
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/verify-windows.ps1 $env:INSTALL_DIR
      - name: Verify output
        if: runner.os == 'Linux'
        shell: bash
        run: ./ci/verify-linux.sh "$INSTALL_DIR"
      - name: Configure installed SDK consumer
        shell: bash
        run: >-
          cmake -S runtimes/tests/sdk -B .cmake-sdk-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/$INSTALL_DIR"
          -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
          -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
      - name: Build installed SDK consumer
        run: cmake --build .cmake-sdk-consumer --config Release --parallel 2
      - name: Run installed SDK consumer
        run: ctest --test-dir .cmake-sdk-consumer -C Release --output-on-failure --no-tests=error
