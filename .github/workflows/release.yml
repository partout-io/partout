# A bump commit updates both version files. A push changing version.zig builds
# the release, tags that exact commit, and publishes its XCFramework.

name: Release

on:
  push:
    branches:
      - master
    paths:
      - src/version.zig
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish Release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: |
          zig_version=$(sed -nE \
            's/^pub const number = "([0-9A-Za-z.+-]+)";$/\1/p' \
            src/version.zig)
          swift_version=$(sed -nE \
            's/^[[:space:]]*public static let version = "([0-9A-Za-z.+-]+)"$/\1/p' \
            cross/apple/Sources/PartoutCore/Version.swift)

          test -n "$zig_version"
          test "$zig_version" = "$swift_version"
          echo "value=$zig_version" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Build XCFramework
        id: xcframework
        run: |
          xcframework="$RUNNER_TEMP/PartoutNative.xcframework"
          prebuilts="$RUNNER_TEMP/prebuilts"
          archive="$xcframework.zip"

          scripts/build-xcframework.sh "$xcframework" "$prebuilts" --full
          test "$(find "$xcframework" -name '*.dSYM' -type d | wc -l)" -eq 5
          ditto -c -k --sequesterRsrc --keepParent "$xcframework" "$archive"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Sign and push tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git tag -s "$VERSION" HEAD -m "$VERSION"
          test "$(git rev-list -n 1 "$VERSION")" = "$GITHUB_SHA"
          git tag --verify "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          ARCHIVE: ${{ steps.xcframework.outputs.archive }}
        run: |
          gh release create "$VERSION" "$ARCHIVE" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false
