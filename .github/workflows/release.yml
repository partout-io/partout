name: Release

on:
  push:
    branches:
      - master
    paths:
      - src/partout.zig
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
      - name: Parse version
        id: parse_version
        env:
          ABI_SOURCE: src/partout.zig
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Releases must be dispatched from a branch"
            exit 1
          fi

          version=$(sed -nE 's/^.*version = "(.*)".*$/\1/p' "$ABI_SOURCE")
          test -n "$version"
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download latest prebuilts
        id: prebuilts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts_dir="$RUNNER_TEMP/prebuilts-artifacts"
          prebuilts_tag=$(ci/download-prebuilts.sh "$artifacts_dir")
          echo "artifacts_dir=$artifacts_dir" >> "$GITHUB_OUTPUT"
          echo "tag=$prebuilts_tag" >> "$GITHUB_OUTPUT"
      - name: Run Zig tests
        run: |
          zig build test -Dopenvpn=true -Dwireguard=true
      - name: Build XCFramework
        id: build_xcframework
        env:
          ARTIFACTS_DIR: ${{ steps.prebuilts.outputs.artifacts_dir }}
          PREBUILTS_TAG: ${{ steps.prebuilts.outputs.tag }}
        run: |
          xcframework="$RUNNER_TEMP/PartoutNative.xcframework"
          archive="$xcframework.zip"
          checksum_file="$archive.checksum"
          prebuilts_version_file="$RUNNER_TEMP/prebuilts-version.txt"

          scripts/build-xcframework.sh "$xcframework" "$ARTIFACTS_DIR" --full --monolith
          ditto -c -k --sequesterRsrc --keepParent "$xcframework" "$archive"
          swift package compute-checksum "$archive" > "$checksum_file"
          echo "$PREBUILTS_TAG" > "$prebuilts_version_file"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "prebuilts_version_file=$prebuilts_version_file" >> "$GITHUB_OUTPUT"
      - name: Update Swift package reference
        id: update_package
        env:
          VERSION: ${{ steps.parse_version.outputs.version }}
          CHECKSUM_FILE: ${{ steps.build_xcframework.outputs.checksum_file }}
        run: |
          if ! ci/update-swift-package.sh \
            "$VERSION" "$CHECKSUM_FILE" "$GITHUB_REF_NAME"; then
            echo "::error::Failed to update Package.swift"
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.parse_version.outputs.version }}
          tag_name: ${{ steps.parse_version.outputs.version }}
          target_commitish: ${{ steps.update_package.outputs.commit }}
          generate_release_notes: true
          files: |
            ${{ steps.build_xcframework.outputs.archive }}
            ${{ steps.build_xcframework.outputs.checksum_file }}
            ${{ steps.build_xcframework.outputs.prebuilts_version_file }}
          fail_on_unmatched_files: true
